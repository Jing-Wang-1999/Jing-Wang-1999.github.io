<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <aside class="sidebar" aria-label="Profile and navigation">
        <a class="identity" href="{{ '/' | relative_url }}" aria-label="Jing Wang home">
          <img class="identity__portrait" src="{{ '/profile.jpg' | relative_url }}" alt="Portrait of Jing Wang" width="108" height="162">
          <span class="identity__name">Jing Wang</span>
          <span class="identity__chinese" lang="zh-Hans">王京</span>
          <span class="identity__role">PhD student at HKUST</span>
        </a>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#background">Background</a>
          <a href="{{ '/' | relative_url }}#research">Research</a>
        </nav>

        <div class="sidebar__links">
          <a href="mailto:{{ site.email | escape }}">Email <span aria-hidden="true">↗</span></a>
          <a href="https://scholar.google.com/citations?user=KSnhcBIAAAAJ&amp;hl=en">Google Scholar <span aria-hidden="true">↗</span></a>
          <a href="https://github.com/Jing-Wang-1999">GitHub <span aria-hidden="true">↗</span></a>
        </div>
      </aside>

      <main id="main-content" class="page-content">{{ content }}</main>
    </div>
  </body>
</html>
